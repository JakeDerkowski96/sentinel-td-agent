[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdagent"
version = "0.1.0"
description = "CLI for the Sentinel Threat Detection agent: content management, audit and coverage reports, and the planned agent modes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  # Pinned by tag so schema changes in the content repo arrive as an explicit bump (ADR 0009).
  "dac-validate @ git+https://github.com/JakeDerkowski96/sentinel-detection-as-code@v0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
tdagent = "tdagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["dac_validate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
